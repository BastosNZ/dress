# CI: testes + build das imagens.
#
# - Pull request pra main: roda aqui direto (e a proteção da main exige que passe)
# - Push na main ou tag de versão: o CD (cd.yml) chama este workflow antes de
#   publicar, então o deploy só acontece se o CI passar. Por isso não tem
#   "push" aqui, senão rodaria duas vezes.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: D.R.E.S.S-main/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: D.R.E.S.S-main/backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes (unidade + integração)
        run: npm test

      # Falha o CI se alguma dependência de produção tiver vulnerabilidade alta ou crítica
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend - checagem
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: D.R.E.S.S-main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: D.R.E.S.S-main/frontend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Conferir se o app.py compila
        run: python -m py_compile app.py

  docker:
    name: Docker - build das imagens
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        servico: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Lint do Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: D.R.E.S.S-main/${{ matrix.servico }}/Dockerfile

      - uses: docker/setup-buildx-action@v3

      # Só builda pra garantir que o Dockerfile funciona. Quem publica é o CD.
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: D.R.E.S.S-main/${{ matrix.servico }}
          push: false
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
