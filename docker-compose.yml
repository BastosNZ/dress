# Sobe o D.R.E.S.S. inteiro: MySQL + API + interface
#
#   cp .env.example .env      (e preencha as senhas)
#   docker compose up -d --build
#
# Interface: http://localhost:8501  |  API: http://localhost:3000/health
#
# Nenhuma senha fica neste arquivo. As variáveis marcadas com :? são
# obrigatórias: se faltarem, o compose para com a mensagem de erro.
# No pipeline elas vêm dos GitHub Secrets (ver docs/DEVOPS.md).

name: dress

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dress}
      MYSQL_USER: ${DB_USER:-dress}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}
      TZ: UTC
    # utf8mb4 pra acentos e emoji funcionarem direito
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    # Sem APP_VERSION usa a imagem buildada na hora (tag "local").
    # No deploy o pipeline define APP_VERSION=1.2.0 e puxa do GHCR.
    image: ${REGISTRY:-ghcr.io/bastosnz}/dress-backend:${APP_VERSION:-local}
    build:
      context: ./D.R.E.S.S-main/backend
      args:
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dress}
      DB_USER: ${DB_USER:-dress}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    image: ${REGISTRY:-ghcr.io/bastosnz}/dress-frontend:${APP_VERSION:-local}
    build:
      context: ./D.R.E.S.S-main/frontend
      args:
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      # "backend" é o nome do serviço acima: dentro da rede do compose ele vira o host
      API_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8501}:8501"

volumes:
  db_data:
